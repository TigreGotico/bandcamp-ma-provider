[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bandcamp-ma-provider"
version = "0.1.0"
description = "Bandcamp provider for Music Assistant via py_bandcamp (no login required)"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["music-assistant-plugin-manager", "py_bandcamp"]

[project.entry-points."music_assistant.provider"]
bandcamp_free = "bandcamp_ma_provider"

[tool.setuptools.packages.find]
include = ["bandcamp_ma_provider*"]

[tool.setuptools.package-data]
bandcamp_ma_provider = ["manifest.json"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
